name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: validate
        run: ./scripts/validate.sh

      - name: idle context cost
        run: ./evals/context-cost.sh skills
